name: windows portability

# The contract and tests on Windows, where people run their Personalspace on
# their own computers. Only code can break that, so this runs only for pull
# requests that change scripts, code, the toolchain or a workflow, and on
# demand; a change of notes, manuals or the workspace never starts it, and
# neither does the push to main after a merge (the pull request already
# proved it). Windows minutes count twice against the owner's GitHub free
# tier; Linux runs for every change in checks.yml.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "schemas/**"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.js"
      - "**/*.ts"
      - "**/package.json"
      - "**/bun.lock"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template-contract:
    name: template contract (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Template contract a testy
        run: bun run check
